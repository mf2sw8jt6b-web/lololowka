<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Белый Город</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Интерфейс входа в город */
        #menu-container {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            z-index: 20;
            border: 1px solid rgba(200, 200, 200, 0.5);
            backdrop-filter: blur(10px);
        }

        #menu-container h1 {
            margin: 0 0 20px 0;
            color: #333;
            font-size: 2em;
        }

        #enter-btn {
            background-color: #333;
            color: #fff;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        #enter-btn:hover {
            background-color: #555;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        /* Интерфейс игры (скрыт изначально) */
        #game-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
            display: none;
        }
        
        .text-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            color: #333;
            max-width: 300px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(200,200,200,0.3);
        }
        
        .text-box h2 { margin: 0 0 10px 0; font-size: 1.2em; color: #111; }
        .text-box p { margin: 5px 0; font-size: 0.95em; color: #555; }
        
        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none; /* Скрыт до нажатия кнопки */
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- Стартовое меню -->
    <div id="menu-container">
        <h1>Белый Город</h1>
        <button id="enter-btn">Войти в город</button>
    </div>

    <!-- Интерфейс внутри города -->
    <div id="game-ui">
        <div class="text-box">
            <h2>Управление</h2>
            <p>Используйте <b>W, A, S, D</b> или <b>Стрелочки</b> для бега.</p>
            <p>Исследуйте район. Двери домов находятся напротив друг друга.</p>
        </div>
    </div>

    <div id="game-canvas"></div>

    <script>
        const enterBtn = document.getElementById('enter-btn');
        const menuContainer = document.getElementById('menu-container');
        const gameUi = document.getElementById('game-ui');
        const gameCanvas = document.getElementById('game-canvas');
        
        let gameStarted = false;

        enterBtn.addEventListener('click', () => {
            menuContainer.style.display = 'none';
            gameUi.style.display = 'block';
            gameCanvas.style.display = 'block';
            if (!gameStarted) {
                initGame();
                gameStarted = true;
            }
        });

        function initGame() {
            // 1. Инициализация сцены
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf5f5f5);
            scene.fog = new THREE.Fog(0xf5f5f5, 20, 60);

            // 2. Настройка камеры 
            const aspect = window.innerWidth / window.innerHeight;
            const d = 14;
            const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
            
            // 3. Рендерер
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            gameCanvas.appendChild(renderer.domElement);

            // 4. Освещение
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.55);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(20, 30, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.left = -25;
            dirLight.shadow.camera.right = 25;
            dirLight.shadow.camera.top = 25;
            dirLight.shadow.camera.bottom = -25;
            dirLight.shadow.bias = -0.0001;
            scene.add(dirLight);

            // 5. Земля
            const groundGeo = new THREE.PlaneGeometry(200, 200);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // 6. Материалы
            const wallMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 });
            const doorMat = new THREE.MeshStandardMaterial({ color: 0xe0e0e0, roughness: 0.5 });
            const playerMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0.1 });

            // 7. Создание домов
            const roomGeo = new THREE.BoxGeometry(6, 4, 6);
            const doorGeo = new THREE.BoxGeometry(1.5, 2.5, 0.2);

            function createRoom(x, z, isTopRow) {
                const group = new THREE.Group();
                const room = new THREE.Mesh(roomGeo, wallMat);
                room.position.y = 2;
                room.castShadow = true;
                room.receiveShadow = true;
                group.add(room);

                const door = new THREE.Mesh(doorGeo, doorMat);
                const doorZOffset = isTopRow ? 3.01 : -3.01;
                door.position.set(0, 1.25, doorZOffset);
                group.add(door);

                group.position.set(x, 0, z);
                scene.add(group);
            }

            const streetWidth = 3;
            const roomZOffset = 3 + streetWidth;

            createRoom(-10, -roomZOffset, true);
            createRoom(0, -roomZOffset, true);
            createRoom(10, -roomZOffset, true);

            createRoom(-10, roomZOffset, false);
            createRoom(0, roomZOffset, false);
            createRoom(10, roomZOffset, false);

            // 8. Игрок
            const playerGeo = new THREE.SphereGeometry(0.8, 32, 32);
            const player = new THREE.Mesh(playerGeo, playerMat);
            player.position.set(0, 0.8, 0);
            player.castShadow = true;
            scene.add(player);

            // 9. Управление
            const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
            window.addEventListener('keydown', (e) => { 
                const key = e.key.toLowerCase();
                if(keys.hasOwnProperty(key)) keys[key] = true; 
                if(keys.hasOwnProperty(e.key)) keys[e.key] = true;
            });
            window.addEventListener('keyup', (e) => { 
                const key = e.key.toLowerCase();
                if(keys.hasOwnProperty(key)) keys[key] = false; 
                if(keys.hasOwnProperty(e.key)) keys[e.key] = false; 
            });

            const speed = 0.15;
            const camOffsetX = 20;
            const camOffsetY = 20;
            const camOffsetZ = 20;

            function animate() {
                requestAnimationFrame(animate);

                let moveX = 0;
                let moveZ = 0;

                if (keys.w || keys.ArrowUp) { moveX -= speed; moveZ -= speed; }
                if (keys.s || keys.ArrowDown) { moveX += speed; moveZ += speed; }
                if (keys.a || keys.ArrowLeft) { moveX -= speed; moveZ += speed; }
                if (keys.d || keys.ArrowRight) { moveX += speed; moveZ -= speed; }

                if (moveX !== 0 && moveZ !== 0) {
                    const length = Math.sqrt(moveX*moveX + moveZ*moveZ);
                    moveX = (moveX / length) * speed;
                    moveZ = (moveZ / length) * speed;
                }

                const nextX = player.position.x + moveX;
                const nextZ = player.position.z + moveZ;
                
                let canMoveX = true;
                let canMoveZ = true;

                const checkCollision = (x, z) => {
                    const margin = 1.0;
                    const isInsideZTop = z < -roomZOffset + 3 + margin && z > -roomZOffset - 3 - margin;
                    const isInsideZBot = z < roomZOffset + 3 + margin && z > roomZOffset - 3 - margin;
                    const isInsideX1 = x < -10 + 3 + margin && x > -10 - 3 - margin;
                    const isInsideX2 = x < 0 + 3 + margin && x > 0 - 3 - margin;
                    const isInsideX3 = x < 10 + 3 + margin && x > 10 - 3 - margin;
                    
                    return (isInsideZTop || isInsideZBot) && (isInsideX1 || isInsideX2 || isInsideX3);
                };

                if (checkCollision(nextX, player.position.z)) canMoveX = false;
                if (checkCollision(player.position.x, nextZ)) canMoveZ = false;

                if (canMoveX) player.position.x = nextX;
                if (canMoveZ) player.position.z = nextZ;

                camera.position.x = player.position.x + camOffsetX;
                camera.position.y = player.position.y + camOffsetY;
                camera.position.z = player.position.z + camOffsetZ;
                camera.lookAt(player.position);

                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                const aspect = window.innerWidth / window.innerHeight;
                camera.left = -d * aspect;
                camera.right = d * aspect;
                camera.top = d;
                camera.bottom = -d;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }
    </script>
</body>
</html>
